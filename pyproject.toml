[project]
name = "local-llm-mcp"
version = "0.1.1"
description = "MCP server exposing locally-hosted OSS LLMs via an OpenAI-compatible endpoint."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "openai>=1.50.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
include = ["server.py"]
