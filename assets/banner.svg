<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="local-llm-mcp — three MCP hosts on the left, a glowing local-llm bridge in the center, four local OSS LLM runtimes on the right, with animated data pulses traveling along the connection lines.">
  <title>local-llm-mcp — host ↔ bridge ↔ local runtimes</title>

  <defs>
    <!-- background gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%"  stop-color="#0f1530"/>
      <stop offset="55%" stop-color="#070a18"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>

    <!-- neon glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- pulse gradient (used as a moving dot) -->
    <radialGradient id="pulseCyan">
      <stop offset="0%"  stop-color="#7ef9ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulseMagenta">
      <stop offset="0%"  stop-color="#ff8ff5" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ff2bd6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulseAmber">
      <stop offset="0%"  stop-color="#ffe2a0" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffaa2b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffaa2b" stop-opacity="0"/>
    </radialGradient>

    <!-- hex bridge gradient -->
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1a2350"/>
      <stop offset="100%" stop-color="#0a0d20"/>
    </linearGradient>

    <!-- connection-line paths (declared once, referenced for animation) -->
    <path id="p_host1_bridge" d="M 230,90  C 360,90 420,160 540,210"  fill="none"/>
    <path id="p_host2_bridge" d="M 230,210 C 360,210 420,210 540,210" fill="none"/>
    <path id="p_host3_bridge" d="M 230,330 C 360,330 420,260 540,210" fill="none"/>

    <path id="p_bridge_run1" d="M 660,210 C 780,210 820,90  950,90"   fill="none"/>
    <path id="p_bridge_run2" d="M 660,210 C 780,210 820,170 950,170"  fill="none"/>
    <path id="p_bridge_run3" d="M 660,210 C 780,210 820,250 950,250"  fill="none"/>
    <path id="p_bridge_run4" d="M 660,210 C 780,210 820,330 950,330"  fill="none"/>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.07" stroke="#7ef9ff" stroke-width="0.5">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200"/>
    <path d="M60 0 V420 M120 0 V420 M180 0 V420 M240 0 V420 M300 0 V420 M360 0 V420 M420 0 V420 M480 0 V420 M540 0 V420 M600 0 V420 M660 0 V420 M720 0 V420 M780 0 V420 M840 0 V420 M900 0 V420 M960 0 V420 M1020 0 V420 M1080 0 V420 M1140 0 V420"/>
  </g>

  <!-- ambient orbs -->
  <g opacity="0.55" filter="url(#softglow)">
    <circle cx="120"  cy="380" r="80" fill="#00d4ff" opacity="0.10"/>
    <circle cx="1080" cy="60"  r="100" fill="#ff2bd6" opacity="0.10"/>
    <circle cx="600"  cy="210" r="140" fill="#7a4cff" opacity="0.10"/>
  </g>

  <!-- connection lines (visible base, neon) -->
  <g fill="none" stroke-width="1.5" opacity="0.55" filter="url(#glow)">
    <use href="#p_host1_bridge" stroke="#00d4ff"/>
    <use href="#p_host2_bridge" stroke="#00d4ff"/>
    <use href="#p_host3_bridge" stroke="#00d4ff"/>
    <use href="#p_bridge_run1" stroke="#ff2bd6"/>
    <use href="#p_bridge_run2" stroke="#ff2bd6"/>
    <use href="#p_bridge_run3" stroke="#ff2bd6"/>
    <use href="#p_bridge_run4" stroke="#ff2bd6"/>
  </g>

  <!-- animated data pulses along each path -->
  <g>
    <!-- host -> bridge (cyan, left to right) -->
    <circle r="6" fill="url(#pulseCyan)">
      <animateMotion dur="2.6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#p_host1_bridge"/>
      </animateMotion>
    </circle>
    <circle r="6" fill="url(#pulseCyan)">
      <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" rotate="auto">
        <mpath href="#p_host2_bridge"/>
      </animateMotion>
    </circle>
    <circle r="6" fill="url(#pulseCyan)">
      <animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#p_host3_bridge"/>
      </animateMotion>
    </circle>

    <!-- bridge -> runtime (magenta, left to right) -->
    <circle r="6" fill="url(#pulseMagenta)">
      <animateMotion dur="2.4s" begin="0.3s" repeatCount="indefinite" rotate="auto">
        <mpath href="#p_bridge_run1"/>
      </animateMotion>
    </circle>
    <circle r="6" fill="url(#pulseMagenta)">
      <animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite" rotate="auto">
        <mpath href="#p_bridge_run2"/>
      </animateMotion>
    </circle>
    <circle r="6" fill="url(#pulseMagenta)">
      <animateMotion dur="2.4s" begin="1.9s" repeatCount="indefinite" rotate="auto">
        <mpath href="#p_bridge_run3"/>
      </animateMotion>
    </circle>
    <circle r="6" fill="url(#pulseMagenta)">
      <animateMotion dur="2.4s" begin="0.7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#p_bridge_run4"/>
      </animateMotion>
    </circle>

    <!-- reverse-direction amber pulse (response stream) on every channel -->
    <circle r="4" fill="url(#pulseAmber)" opacity="0.85">
      <animateMotion dur="3.0s" begin="1.5s" repeatCount="indefinite" rotate="auto" keyPoints="1;0" keyTimes="0;1" calcMode="linear">
        <mpath href="#p_bridge_run2"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="url(#pulseAmber)" opacity="0.85">
      <animateMotion dur="3.0s" begin="0.4s" repeatCount="indefinite" rotate="auto" keyPoints="1;0" keyTimes="0;1" calcMode="linear">
        <mpath href="#p_host2_bridge"/>
      </animateMotion>
    </circle>
  </g>

  <!-- host nodes (left column) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600">
    <!-- Claude Code -->
    <g transform="translate(70,60)">
      <rect width="180" height="60" rx="10" fill="#0d1430" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="22" cy="30" r="8" fill="#00d4ff" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="28" fill="#eaf6ff" font-size="14">Claude Code</text>
      <text x="42" y="46" fill="#8aa5c4" font-size="11">stdio MCP host</text>
    </g>
    <!-- Claude Desktop -->
    <g transform="translate(70,180)">
      <rect width="180" height="60" rx="10" fill="#0d1430" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="22" cy="30" r="8" fill="#00d4ff" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="28" fill="#eaf6ff" font-size="14">Claude Desktop</text>
      <text x="42" y="46" fill="#8aa5c4" font-size="11">DXT extension</text>
    </g>
    <!-- Codex CLI -->
    <g transform="translate(70,300)">
      <rect width="180" height="60" rx="10" fill="#0d1430" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="22" cy="30" r="8" fill="#00d4ff" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="28" fill="#eaf6ff" font-size="14">Codex CLI</text>
      <text x="42" y="46" fill="#8aa5c4" font-size="11">+ any MCP client</text>
    </g>
  </g>

  <!-- central hexagonal bridge -->
  <g transform="translate(600,210)" filter="url(#softglow)">
    <!-- outer hex (pulsing) -->
    <polygon points="-80,0 -40,-69 40,-69 80,0 40,69 -40,69"
             fill="url(#hexFill)" stroke="#7ef9ff" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
    </polygon>
    <!-- inner hex -->
    <polygon points="-55,0 -27,-48 27,-48 55,0 27,48 -27,48"
             fill="none" stroke="#ff2bd6" stroke-width="1" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </polygon>
    <!-- label -->
    <text text-anchor="middle" y="-4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20" font-weight="700" fill="#eaf6ff">local-llm</text>
    <text text-anchor="middle" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11" fill="#8aa5c4">MCP bridge</text>
    <text text-anchor="middle" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="9" fill="#7ef9ff" opacity="0.85">list_models · chat · compare</text>
  </g>

  <!-- right column: local runtimes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600">
    <g transform="translate(950,60)">
      <rect width="190" height="60" rx="10" fill="#0d1430" stroke="#ff2bd6" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="22" cy="30" r="8" fill="#ff2bd6" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="28" fill="#ffeaff" font-size="14">Ollama</text>
      <text x="42" y="46" fill="#c79ebf" font-size="11">qwen, gemma, llama…</text>
    </g>
    <g transform="translate(950,140)">
      <rect width="190" height="60" rx="10" fill="#0d1430" stroke="#ff2bd6" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="22" cy="30" r="8" fill="#ff2bd6" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="28" fill="#ffeaff" font-size="14">LM Studio</text>
      <text x="42" y="46" fill="#c79ebf" font-size="11">OpenAI-compat REST</text>
    </g>
    <g transform="translate(950,220)">
      <rect width="190" height="60" rx="10" fill="#0d1430" stroke="#ff2bd6" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="22" cy="30" r="8" fill="#ff2bd6" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="1.0s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="28" fill="#ffeaff" font-size="14">vLLM</text>
      <text x="42" y="46" fill="#c79ebf" font-size="11">high-throughput serve</text>
    </g>
    <g transform="translate(950,300)">
      <rect width="190" height="60" rx="10" fill="#0d1430" stroke="#ff2bd6" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="22" cy="30" r="8" fill="#ff2bd6" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="28" fill="#ffeaff" font-size="14">llama.cpp / +</text>
      <text x="42" y="46" fill="#c79ebf" font-size="11">any OpenAI-compat</text>
    </g>
  </g>

  <!-- header / wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="600" y="28" text-anchor="middle" font-size="13" fill="#7ef9ff" opacity="0.85" letter-spacing="6">L O C A L &#160;·&#160; L L M &#160;·&#160; M C P</text>
    <text x="600" y="400" text-anchor="middle" font-size="11" fill="#8aa5c4" opacity="0.75">tiered AI · local first · pairs with cloud MCPs · MIT</text>
  </g>
</svg>
